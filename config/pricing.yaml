# Versioned price book. Prices are USD per 1M tokens.
# Bump `version` whenever a price changes; every ledger row records the version it was
# priced with, so historical chargeback stays reproducible.
# Any model NOT listed here is rejected by the gateway (ADR-0002).
# `cached_input` (optional) is the price of prompt tokens the provider served from its prompt
# cache (`usage.prompt_tokens_details.cached_tokens`); without it they cost the `input` price.
# `cache_write` and `cache_write_1h` (optional) are the prices of prompt tokens written to the
# cache with the 5-minute and the 1-hour lifetime (Anthropic); without them writes cost `input`.
version: "2026-11-16"
currency: USD
models:
  # `provider` (optional) names the adapter that serves the model: ollama, azure_openai or
  # openai_compat (ADR-0011). Rows without it go to LFG_PROVIDER. A provider that is not
  # configured falls back to the default with a startup warning.
  # `llm-finops-gateway pricing sync --region <region>` checks the azure_openai rows against the
  # Azure Retail Prices API (ADR-0013). `sku: regional|datazone` marks a row whose deployment
  # is not Global Standard; `version: YYYY-MM-DD` picks the model version when Azure prices
  # several differently (gpt-4o).
  # Azure OpenAI deployments (map model -> deployment with LFG_AZURE_OPENAI_DEPLOYMENTS).
  # Global Standard list prices; regional and Data Zone deployments can differ.
  gpt-4o: { input: 2.50, output: 10.00, cached_input: 1.25, provider: azure_openai, version: 2024-11-20 }
  gpt-4o-mini: { input: 0.15, output: 0.60, cached_input: 0.075, provider: azure_openai }
  gpt-4.1: { input: 2.00, output: 8.00, cached_input: 0.50, provider: azure_openai }
  gpt-4.1-mini: { input: 0.40, output: 1.60, cached_input: 0.10, provider: azure_openai }
  # Reasoning models: `reasoning: true` makes the gateway send max_completion_tokens instead of
  # max_tokens and drop the temperature, which these models reject. Reasoning tokens are part of
  # completion_tokens and are billed as output.
  gpt-5: { input: 1.25, output: 10.00, cached_input: 0.125, provider: azure_openai, reasoning: true }
  gpt-5-mini: { input: 0.25, output: 2.00, cached_input: 0.025, provider: azure_openai, reasoning: true }
  gpt-5-nano: { input: 0.05, output: 0.40, cached_input: 0.005, provider: azure_openai, reasoning: true }
  # Claude models, served through the LiteLLM plugin on /v1/messages (ADR-0027); the standalone
  # gateway has no Anthropic adapter. Anthropic list prices: cache writes are 1.25 x input for
  # 5 minutes and 2 x input for 1 hour. The Haiku row is the price up to 100K prompt tokens;
  # longer prompts cost 0.50 / 2.50 at Anthropic, which a flat row does not model.
  claude-fable-5-2: { input: 8.00, output: 40.00, cached_input: 0.20, cache_write: 10.00, cache_write_1h: 16.00, provider: anthropic }
  claude-opus-5-5: { input: 4.00, output: 20.00, cached_input: 0.20, cache_write: 5.00, cache_write_1h: 8.00, provider: anthropic }
  claude-sonnet-5-5: { input: 2.00, output: 10.00, cached_input: 0.10, cache_write: 2.50, cache_write_1h: 4.00, provider: anthropic }
  claude-haiku-5-5: { input: 0.10, output: 0.50, cached_input: 0.01, cache_write: 0.125, cache_write_1h: 0.20, provider: anthropic }
  # Local Ollama models. Zero today; amortised GPU/hour cost is on the roadmap.
  "llama3.1:8b": { input: 0.00, output: 0.00, provider: ollama }
  "llama3.2:3b": { input: 0.00, output: 0.00, provider: ollama }
  "mistral:7b": { input: 0.00, output: 0.00, provider: ollama }
