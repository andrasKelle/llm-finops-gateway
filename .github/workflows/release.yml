name: release

on:
  push:
    tags: ["v*.*.*"]
  # Rebuild and push the image of an existing tag (for example after a change to this
  # workflow). Builds the tag's sources; the GitHub Release is left as it is.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build the image from, e.g. v0.4.0"
        required: true
      latest:
        description: "Also move the latest tag to this image"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # arm64 is built under emulation, so the image runs on Apple Silicon and Graviton as well
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # GHCR requires a lowercase repository name; github.repository keeps the owner's casing.
      - id: image
        run: echo "name=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr "[:upper:]" "[:lower:]")" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:${{ inputs.tag || github.ref_name }}
            ${{ (github.event_name == 'push' || inputs.latest) && format('{0}:latest', steps.image.outputs.name) || '' }}
      - uses: softprops/action-gh-release@v3
        if: github.event_name == 'push'
        with:
          files: dist/*
          generate_release_notes: true

  # The wheel and the sdist go to PyPI through a trusted publisher: PyPI trusts this workflow
  # in the `pypi` environment, so there is no token in the repository. Tag pushes only; a
  # manual image rebuild does not publish.
  pypi:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
